name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys. Do NOT cancel an in-progress deploy: cancelling
# actions/deploy-pages mid-flight strands the Pages backend in
# "deployment_in_progress", which makes the next run hang until it times out
# ("Timeout reached, aborting!"). Letting each deploy finish before the next
# starts is GitHub's recommended setting for Pages.
#
# PR validation gets its own group so it can neither queue behind a deploy nor
# delay one. It never touches Pages, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.event_name == 'pull_request' && 'pr-validation' || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `npm test` hands a glob to `node --test`, which only expands globs
          # from Node 21 on. On 20 the pattern is read as a literal path and the
          # job dies with "Could not find '.../src/**/*.test.js'".
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    # A PR only needs the tests. Without this guard the PR would build and try
    # to publish Pages from an unreviewed branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
